name: cherry_peaked_docs
description: "Document Scanner for Flutter Mobile"
version: 0.8.0
homepage: "https://cherrypeak.eu/"
repository: "https://github.com/CherryPeak-org/cherry_peaked_docs"

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: eu.cherrypeak.plugins.cherry_peaked_docs
        pluginClass: CherryPeakedDocsPlugin
      ios:
        pluginClass: CherryPeakedDocsPlugin
